<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我们的第一个网页</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>我们的第一个网页</h1>
    <p class="subtitle">点下面的按钮，数字会变，说明 JavaScript 跑通了</p>

    <div class="counter" id="count">0</div>

    <div class="buttons">
      <button class="btn" id="minus">-1</button>
      <button class="btn btn-primary" id="plus">+1</button>
    </div>

    <button class="btn-reset" id="reset">归零</button>

    <p class="hint" id="hint">还没开始点</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
